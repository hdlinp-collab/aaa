plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.trickcalc'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.trickcalc'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 方便直接安裝：release 也用 debug 金鑰簽章
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
